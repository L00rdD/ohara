<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1a0e">
  <title>Ohara</title>
  <link rel="icon" href="/ohara.svg">
  <link rel="stylesheet" href="/ohara.css">
</head>
<body>
  <div class="trunk" id="trunk">
    <div class="canopy" aria-hidden="true"></div>
    <canvas class="motes" id="motes" aria-hidden="true"></canvas>

    <header class="top">
      <a class="brand" href="/"><b>Ohara</b><i data-w="motto"></i></a>
      <button class="search-field" id="open-search" type="button"><span aria-hidden="true">⌕</span><span data-w="search"></span></button>
      <button class="round lantern off" id="lantern" type="button" aria-expanded="false">
        <span class="glow"></span>
        <svg viewBox="0 0 30 38" aria-hidden="true"><path d="M9 6h12M15 1v5" stroke="#c9a46a" stroke-width="2" fill="none"/><path d="M8 8h14l2 4v18l-2 4H8l-2-4V12z" fill="rgba(30,18,8,.6)" stroke="#c9a46a" stroke-width="1.6"/><clipPath id="lantern-glass"><path d="M8.6 9.2h12.8l1.6 3.2v17.2l-1.6 3.2H8.6l-1.6-3.2V12.4z"/></clipPath><rect id="lantern-fill" clip-path="url(#lantern-glass)" x="5" y="38" width="20" height="40" fill="#f6b95a"/><path id="lantern-flame" d="M15 15c2 3 2 6 0 8-2-2-2-5 0-8z" fill="#fff4d6" opacity=".15"/></svg>
        <span class="count" id="lantern-count"></span>
      </button>
      <button class="round flag" id="flag" type="button"></button>
      <button class="round" id="open-contents" type="button">≡</button>
      <button class="round" id="open-settings" type="button">⚙</button>
    </header>

    <div class="parchment contents" id="contents" hidden></div>
    <div class="parchment" id="downloads" hidden><h4 data-w="lantern"></h4><div id="download-list"></div></div>

    <main class="rotunda" id="rotunda" tabindex="0">
      <div class="floor" aria-hidden="true"></div>
      <div class="drum" id="drum"></div>
      <div class="beam" aria-hidden="true"></div>
    </main>
    <button class="round turn l" id="turn-left" type="button">‹</button>
    <button class="round turn r" id="turn-right" type="button">›</button>

    <div class="lectern" id="lectern" hidden></div>
    <p class="selection" id="selection" hidden><b></b><small></small></p>
  </div>

  <section class="sheet" id="series" hidden></section>

  <section class="drawer" id="search" hidden>
    <form class="drawer-head" id="search-form" role="search">
      <input type="search" name="q" autocomplete="off" required>
      <button class="button" type="button" id="close-search" data-w="close"></button>
    </form>
    <div class="drawer-body">
      <div class="drawer-title"><h2 id="search-title"></h2><label class="check"><input type="checkbox" id="all-languages"> <span data-w="alsoEnglish"></span></label></div>
      <p class="searching" id="searching" hidden data-w="searching"></p>
      <div class="cards" id="finds"></div>
    </div>
  </section>

  <section class="sheet small" id="settings" hidden></section>

  <script src="/i18n.js"></script>
  <script src="/ui.js"></script>
  <script src="/words.js"></script>
  <script src="/music.js"></script>
  <script src="/rotunda.js"></script>
  <script src="/search.js"></script>
  <script src="/settings.js"></script>
  <script src="/library.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ohara</title>
  <link rel="icon" href="/ohara.svg">
  <link rel="stylesheet" href="/reader.css">
</head>
<body>
  <div class="stage" id="stage" data-fit="height"></div>
  <button class="btn menu" id="menu" type="button">☰</button>

  <header class="bar" id="top">
    <a class="btn" id="back" href="/">‹ <span data-w="back"></span></a>
    <span class="title" id="title"></span>
    <span class="count" id="count"></span>
  </header>
  <footer class="bar" id="bottom">
    <input type="range" id="slider" min="1" value="1" aria-label="Page">
    <button class="btn" id="mode" type="button"></button>
    <button class="btn" id="fit" type="button"></button>
  </footer>

  <div class="end" id="end" hidden>
    <p id="end-text" data-w="endOfVolume"></p>
    <a class="btn main" id="next-volume" hidden data-w="nextVolume"></a>
    <a class="btn" id="end-back" href="/" data-w="backToLibrary"></a>
    <button class="btn" id="end-stay" type="button" data-w="stayLast"></button>
  </div>
  <button class="music-pill" id="music-pill" type="button" hidden><span class="state">♪</span><span class="what"></span></button>
  <section class="music-panel" id="music-panel" hidden></section>
  <script src="/i18n.js"></script>
  <script src="/music.js"></script>
  <script src="/player.js"></script>
  <script src="/reader.js" defer></script>
</body>
</html>

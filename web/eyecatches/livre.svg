<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <!-- Ohara's own eyecatch: a book lies open and its pages turn by themselves -->
  <style>
    .page { transform-origin: 320px 0; transform-box: view-box; animation: turn 1.1s ease-in-out both; }
    .p1 { animation-delay: .5s; } .p2 { animation-delay: 1.3s; } .p3 { animation-delay: 2.1s; }
    @keyframes turn { from { transform: scaleX(1); } 50% { fill: #e9dcbc; } to { transform: scaleX(-1); } }
    .book { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(20px); } }
    .name { font: italic 44px Georgia, serif; fill: #c9a46a; letter-spacing: 6px; animation: show 1s 3.1s both; }
    @keyframes show { from { opacity: 0; } }
    .glow { animation: breathe 3s ease-in-out infinite alternate; }
    @keyframes breathe { to { opacity: .55; } }
  </style>
  <defs>
    <radialGradient id="light" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#6b4521"/><stop offset="1" stop-color="#1c1009"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#light)"/>
  <ellipse class="glow" cx="320" cy="200" rx="230" ry="120" fill="#f6b95a" opacity=".25"/>
  <g class="book">
    <path d="M90 120 Q205 95 320 128 Q435 95 550 120 L550 300 Q435 275 320 308 Q205 275 90 300 Z" fill="#5a2c17"/>
    <path d="M100 112 Q210 90 320 118 L320 296 Q210 268 100 290 Z" fill="#fdf6e6"/>
    <path d="M540 112 Q430 90 320 118 L320 296 Q430 268 540 290 Z" fill="#fdf6e6"/>
    <g stroke="#c9b48a" stroke-width="3" fill="none" opacity=".7">
      <path d="M130 140 Q215 125 295 145M130 170 Q215 155 295 175M130 200 Q215 185 295 205M130 230 Q215 215 295 235"/>
      <path d="M345 145 Q425 125 510 140M345 175 Q425 155 510 170M345 205 Q425 185 510 200M345 235 Q425 215 510 230"/>
    </g>
    <path class="page p1" d="M540 112 Q430 92 320 118 L320 296 Q430 270 540 290 Z" fill="#f4ead2" stroke="#d8c7a0"/>
    <path class="page p2" d="M536 114 Q430 95 320 118 L320 296 Q430 272 536 292 Z" fill="#f7eedb" stroke="#d8c7a0"/>
    <path class="page p3" d="M532 116 Q430 98 320 118 L320 296 Q430 274 532 294 Z" fill="#fbf3e2" stroke="#d8c7a0"/>
    <path d="M320 118 L320 296" stroke="#a8875a" stroke-width="2"/>
  </g>
  <text class="name" x="320" y="365" text-anchor="middle">Ohara</text>
</svg>
